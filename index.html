<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<title>Tummy Scanner 3000</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b1220; color: #eaf6ff;
    font-family: "Trebuchet MS", "Comic Sans MS", Verdana, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  #app { position: fixed; inset: 0; }

  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    justify-content: safe center;      /* never clips the top on short screens */
    padding: calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
             calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    text-align: center; gap: 16px;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .hidden { display: none !important; }

  /* ---- small / short phones ---- */
  @media (max-height: 700px) {
    .screen { gap: 11px; }
    .blob { font-size: clamp(38px, 13vw, 60px); }
    h1 { font-size: clamp(21px, 6.6vw, 30px); }
    .bigbtn { padding: 15px 32px; }
    .factbox { padding: 12px 14px; }
  }
  @media (max-height: 580px) {
    .screen { gap: 8px; }
    .blob { display: none; }
    .sub { font-size: 13px; }
  }
  @media (max-width: 360px) {
    .chip { padding: 7px 10px; font-size: 13px; border-radius: 13px; }
    .food { border-radius: 14px; padding: 8px 0 6px; }
  }

  /* ---------- START ---------- */
  #start {
    background: radial-gradient(circle at 50% 30%, #16324f 0%, #0b1220 70%);
  }
  h1 {
    margin: 0; font-size: clamp(28px, 9vw, 46px); line-height: 1.1;
    letter-spacing: 1px;
    text-shadow: 0 0 22px rgba(80, 255, 160, .45);
  }
  .sub { margin: 0; font-size: clamp(14px, 4.2vw, 19px); opacity: .78; max-width: 22ch; line-height: 1.45; }

  .bigbtn {
    margin-top: 10px;
    border: none; border-radius: 999px;
    padding: 20px 44px;
    font: inherit; font-weight: bold; font-size: clamp(19px, 5.6vw, 25px);
    color: #04240f;
    background: linear-gradient(180deg, #7dffb0, #24c46b);
    box-shadow: 0 10px 0 #0d7c40, 0 16px 34px rgba(36, 196, 107, .45);
    transition: transform .08s, box-shadow .08s;
  }
  .bigbtn:active { transform: translateY(7px); box-shadow: 0 3px 0 #0d7c40, 0 6px 16px rgba(36,196,107,.35); }
  .bigbtn.red { color: #2c0000; background: linear-gradient(180deg, #ffb3a7, #ff5a3c); box-shadow: 0 10px 0 #a32a13, 0 16px 34px rgba(255,90,60,.4); }
  .bigbtn.red:active { box-shadow: 0 3px 0 #a32a13; }

  .blob { font-size: clamp(56px, 20vw, 110px); filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-14px) rotate(4deg);} }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  .hudrow { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
  @media (max-width: 390px) { #freezeTxt, #torchTxt { display: none; } }
  .chip {
    pointer-events: auto;
    background: rgba(6, 14, 26, .68);
    border: 2px solid rgba(160, 195, 240, .34);
    backdrop-filter: blur(6px);
    border-radius: 16px; padding: 9px 14px;
    font-size: 15px; font-weight: bold; color: #dbe8fb;
    display: flex; align-items: center; gap: 8px;
  }
  .chip.warn { border-color: rgba(255,120,90,.55); color: #ffdfd6; }
  .chip:active { transform: scale(.94); }

  /* messages sit along the bottom, below the scan fan, not over the belly */
  .hudbottom {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; width: 100%;
  }

  #status {
    align-self: center; font-size: clamp(15px, 4.3vw, 20px); font-weight: bold;
    background: rgba(6, 14, 26, .7); backdrop-filter: blur(6px);
    padding: 12px 20px; border-radius: 18px; max-width: 92%;
    border: 2px solid rgba(160, 195, 240, .3);
    text-shadow: 0 1px 6px rgba(0,0,0,.7);
    color: #e6efff;
  }
  #status.bad { border-color: rgba(255,110,80,.6); background: rgba(46,8,4,.7); }
  #status.good { border-color: rgba(120,255,170,.6); background: rgba(4,42,22,.7); }
  #status.pop { animation: statusPop .26s ease-out; }
  @keyframes statusPop {
    from { transform: translateY(8px) scale(.96); opacity: .35; }
    to   { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { #status.pop { animation: none; } }

  /* ---------- FOOD TRAY ---------- */
  #tray {
    pointer-events: auto;
    background: rgba(6, 16, 28, .72); backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,.14);
    border-radius: 24px; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  #tray .label { font-size: 13px; opacity: .8; letter-spacing: .5px; }
  .foods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .food {
    border: none; border-radius: 18px; padding: 10px 0 8px;
    background: rgba(255,255,255,.09);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font: inherit; color: #eaf6ff;
    transition: transform .08s, background .15s;
  }
  .food .emoji { font-size: clamp(24px, 7.4vw, 34px); line-height: 1; }
  .food .name { font-size: 10px; opacity: .72; }
  .food:active { transform: scale(.88); background: rgba(255,255,255,.2); }

  /* ---------- OVERLAYS ---------- */
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .28s; }
  #result { background: radial-gradient(circle at 50% 30%, #16324f 0%, #0b1220 72%); }
  #result.clean { background: radial-gradient(circle at 50% 35%, #0e5233 0%, #061a12 75%); }
  #result h1 { text-shadow: 0 0 26px rgba(140,200,255,.5); }
  #result.clean h1 { text-shadow: 0 0 26px rgba(120,255,170,.6); }
  /* who is being scanned */
  #who { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 420px; }
  .kid {
    border: 2px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07);
    border-radius: 16px; padding: 8px 12px 6px; font: inherit; color: #eaf6ff;
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px;
    transition: transform .08s, border-color .15s, background .15s;
  }
  .kid .face { font-size: 24px; line-height: 1; }
  .kid .kname { font-size: 11px; opacity: .75; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kid.on { border-color: rgba(125,255,176,.9); background: rgba(125,255,176,.16); }
  .kid.on .kname { opacity: 1; }
  .kid.add { opacity: .6; }
  .kid:active { transform: scale(.93); }

  #diet { background: radial-gradient(circle at 50% 25%, #16324f 0%, #0b1220 72%); }
  #dietFoods { grid-template-columns: repeat(4, 1fr); gap: 7px; }
  @media (max-height: 700px) { #dietFoods { grid-template-columns: repeat(6, 1fr); } }
  @media (max-width: 340px) { #dietFoods { grid-template-columns: repeat(3, 1fr); } }
  .food.on {
    background: rgba(255,255,255,.26);
    outline: 3px solid rgba(160,210,255,.85);
  }
  .food.on .name { opacity: 1; }
  .factbox {
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.16);
    border-radius: 20px; padding: 16px 18px; max-width: 30ch;
    font-size: clamp(14px, 4.1vw, 17px); line-height: 1.5;
  }
  /* ---------- DEBUG / TUNING PANEL (long-press the 🪱 chip) ---------- */
  #debug {
    position: absolute; left: 8px; top: calc(64px + env(safe-area-inset-top));
    width: min(230px, 62vw); z-index: 30; pointer-events: auto;
    background: rgba(4, 8, 14, .88); border: 1px solid rgba(160,195,240,.4);
    border-radius: 12px; padding: 9px 10px;
    font: 11px/1.45 ui-monospace, Menlo, Consolas, monospace;
    color: #cfe2ff; max-height: 66vh; overflow-y: auto;
    backdrop-filter: blur(6px);
  }
  #debug b { color: #9fe8c0; }
  #dbgHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  #dbgClose { padding: 0 6px; color: #ffb9a8; font-size: 14px; }
  #dbgStats { white-space: pre; margin-bottom: 8px; color: #b8cbe6; }
  .trow { margin: 7px 0; }
  .trow .lab { display: flex; justify-content: space-between; }
  .trow input[type=range] { width: 100%; margin: 2px 0 0; height: 20px; accent-color: #7dffb0; }
  #debug button {
    font: inherit; color: #cfe2ff; background: rgba(255,255,255,.1);
    border: 1px solid rgba(160,195,240,.35); border-radius: 7px;
    padding: 5px 9px; margin: 4px 4px 0 0;
  }
  #dbgOut { margin-top: 6px; color: #9fe8c0; word-break: break-all; white-space: normal; }

  #err { color: #ffd9d0; font-size: 15px; line-height: 1.5; max-width: 32ch; }
  code { background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 6px; font-size: .92em; }

  /* ---------- GALLERY ---------- */
  .linkbtn {
    border: 2px solid rgba(255,255,255,.22); background: rgba(255,255,255,.07);
    color: #eaf6ff; font: inherit; font-size: 16px; font-weight: bold;
    border-radius: 999px; padding: 12px 26px;
  }
  .linkbtn:active { transform: scale(.95); }
  #gallery { background: #0b1220; justify-content: flex-start; padding-top: calc(20px + env(safe-area-inset-top)); gap: 14px; }
  #gallery h1 { font-size: clamp(22px, 6.5vw, 32px); }
  #shots {
    width: 100%; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start;
  }
  .shot { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid rgba(125,255,176,.28); background: #000; }
  .shot img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
  .shot .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    padding: 16px 8px 6px; font-size: 11px; text-align: left;
  }
  .shot .del {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px;
    border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #ffb9a8;
    font-size: 15px; line-height: 1; font-weight: bold;
  }
  #viewer { background: rgba(4,8,14,.96); z-index: 20; }
  #viewer img { max-width: 100%; max-height: 74vh; border-radius: 18px; border: 2px solid rgba(125,255,176,.3); }
  .empty { opacity: .55; font-size: 15px; grid-column: 1 / -1; padding: 40px 10px; }
</style>
</head>
<body>
<div id="app">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="fx"></canvas>
  <div id="flash"></div>

  <!-- Tuning panel. Hidden; long-press the worm-count chip for ~0.8s. -->
  <div id="debug" class="hidden">
    <div id="dbgHead"><b>CV TUNING</b><span id="dbgClose">✕</span></div>
    <div id="dbgStats">–</div>
    <div id="dbgTune"></div>
    <label class="trow" style="display:flex; gap:6px; align-items:center;">
      <input type="checkbox" id="dbgMask"> show mask + window
    </label>
    <button id="dbgReset">defaults</button>
    <button id="dbgCopy">copy values</button>
    <div id="dbgOut"></div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hudrow">
      <div class="chip" id="count">🪱 <span id="countnum">0</span></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <div class="chip" id="freezeBtn">❄️ <span id="freezeTxt">Hold</span></div>
        <div class="chip" id="saveBtn">📸</div>
        <div class="chip" id="torchBtn">🔦 <span id="torchTxt">Light</span></div>
        <div class="chip warn" id="stopBtn">✕</div>
      </div>
    </div>

    <!-- messages and actions live along the bottom, clear of the scan area -->
    <div class="hudbottom">
    <div id="status">Point at the belly…</div>

    <div id="revealWrap" class="hidden" style="pointer-events:auto; display:flex; justify-content:center;">
      <button class="bigbtn" id="revealBtn" style="padding:18px 38px; font-size:21px;">👁️ SEE INSIDE</button>
    </div>

    <div id="doneWrap" class="hidden" style="pointer-events:auto; display:flex; justify-content:center;">
      <button class="bigbtn" id="doneBtn" style="padding:16px 34px; font-size:19px;">WHAT DOES IT MEAN?</button>
    </div>
    </div>
  </div>

  <!-- START -->
  <div class="screen" id="start">
    <div class="blob">🫃</div>
    <h1>TUMMY<br>SCANNER 3000</h1>
    <p class="sub">Who's getting scanned?</p>
    <div id="who"></div>
    <div id="homeState" class="sub" style="font-size:14px; color:#a9e6c4; min-height:1.2em;"></div>
    <button class="bigbtn" id="go">SCAN THIS BELLY</button>
    <button class="linkbtn" id="openGallery">📁 Saved scans (<span id="galcount">0</span>)</button>
    <p class="sub" style="font-size:12px; opacity:.45; max-width:28ch;">A pretend X-ray game. Not a real medical scanner.</p>
    <div id="err" class="hidden"></div>
  </div>

  <!-- DIET: parent fills this in before scanning -->
  <div class="screen hidden" id="diet">
    <h1 id="dietTitle" style="font-size:clamp(22px,6.5vw,32px);">WHAT DID YOU<br>EAT TODAY?</h1>
    <p class="sub">Tap everything you had. Be honest — the scanner knows 👀</p>
    <div id="dietFoods" class="foods" style="width:100%; max-width:420px;"></div>
    <div class="sub" id="dietTally" style="font-size:13px; min-height:1.2em;"></div>
    <button class="bigbtn" id="toScan">START THE SCAN</button>
  </div>

  <!-- RESULT -->
  <div class="screen hidden" id="result">
    <div class="blob" id="resultEmoji">🪱</div>
    <h1 id="resultTitle" style="font-size:clamp(22px,7vw,34px);"></h1>
    <div class="factbox" id="resultBody"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
      <button class="bigbtn" id="again">SCAN AGAIN</button>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="screen hidden" id="gallery">
    <h1>📁 SAVED SCANS</h1>
    <p class="sub" style="font-size:13px;">Tap one to show it to someone else.</p>
    <div id="shots"></div>
    <button class="linkbtn" id="galBack">← Back</button>
  </div>

  <!-- VIEWER -->
  <div class="screen hidden" id="viewer">
    <img id="viewerImg" alt="Saved belly scan">
    <div id="viewerCap" class="sub" style="font-size:14px;"></div>
    <button class="bigbtn" id="viewerBack">CLOSE</button>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // helpers
  // ------------------------------------------------------------------
  var $ = function (id) { return document.getElementById(id); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var randInt = function (a, b) { return Math.floor(rand(a, b + 1)); };
  var pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

  // ------------------------------------------------------------------
  // TUNING
  // Every threshold the computer-vision code depends on lives here, so it can
  // be adjusted on a real phone against a real tummy instead of guessed at.
  // Long-press the worm-count chip to open the panel.
  // ------------------------------------------------------------------
  var TUNE_DEFAULTS = {
    navelScore: -5,    // navel accepted when its centre-surround score is below this
    maskK: 0.2,        // body threshold = -maskK x std-dev of brightness
    flowConf: 0.05,    // reject a motion estimate below this confidence
    flowTex: 5,        // reject it if the patch has less texture than this
    showMask: 0
  };
  var TUNE_SPEC = [
    { k: "navelScore", label: "navel ≤", min: -25, max: -0.5, step: 0.5 },
    { k: "maskK",      label: "mask k",      min: 0,   max: 1.2,  step: 0.05 },
    { k: "flowConf",   label: "conf ≥", min: 0,   max: 0.4,  step: 0.01 },
    { k: "flowTex",    label: "tex ≥",  min: 0,   max: 30,   step: 1 }
  ];
  var TUNE_KEY = "bellyTune.v1";
  var TUNE = {};

  function loadTune() {
    for (var k in TUNE_DEFAULTS) TUNE[k] = TUNE_DEFAULTS[k];
    try {
      var saved = JSON.parse(localStorage.getItem(TUNE_KEY) || "{}");
      for (var j in saved) if (j in TUNE_DEFAULTS && isFinite(saved[j])) TUNE[j] = saved[j];
    } catch (e) {}
  }
  function saveTune() {
    try { localStorage.setItem(TUNE_KEY, JSON.stringify(TUNE)); } catch (e) {}
  }
  loadTune();

  // live readings, for the panel
  var dbg = { navelScore: 0, maskFrac: 0, fps: 0, dx: 0, dy: 0 };

  var video = $("cam"), canvas = $("fx"), ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  // dropped to 1 automatically if the phone can't keep up
  var maxDPR = 2, lowQ = false;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, maxDPR);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 250); });

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

  // stop the screen dimming while a scan is on
  var wakeLock = null;
  function keepAwake(on) {
    try {
      if (on && navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request("screen").then(function (wl) {
          wakeLock = wl;
          wl.addEventListener("release", function () { wakeLock = null; });
        }).catch(function () {});
      } else if (!on && wakeLock) {
        wakeLock.release().catch(function () {});
        wakeLock = null;
      }
    } catch (e) {}
  }

  // tiny sound engine (no files needed)
  var AC = null;
  function audio() {
    if (!AC) { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  // The only sound in the app: the soft hiss of the scanner while it runs.
  var noiseSrc = null, noiseGain = null;

  function startNoise() {
    var a = audio();
    if (!a || noiseSrc) return;
    try {
      var len = Math.floor(a.sampleRate * 2);
      var buf = a.createBuffer(1, len, a.sampleRate);
      var ch = buf.getChannelData(0);
      for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * 0.7;

      noiseSrc = a.createBufferSource();
      noiseSrc.buffer = buf;
      noiseSrc.loop = true;

      var bp = a.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 0.6;
      var lp = a.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 2800;

      noiseGain = a.createGain();
      noiseGain.gain.setValueAtTime(0, a.currentTime);
      noiseGain.gain.linearRampToValueAtTime(0.05, a.currentTime + 0.7);

      noiseSrc.connect(bp); bp.connect(lp); lp.connect(noiseGain);
      noiseGain.connect(a.destination);
      noiseSrc.start();
    } catch (e) { noiseSrc = null; noiseGain = null; }
  }

  // A soft two-note sonar ping when something is found. Deliberately not an
  // alarm: a harsh alert attached to "something is wrong inside your body" is a
  // good way to make a child anxious about eating. Sounds like a game, over in
  // half a second, and never repeats.
  function sonarPing() {
    var a = audio();
    if (!a) return;
    var t0 = a.currentTime;
    // the second note is lower and quieter, so it reads as the returning echo
    [{ f: 1320, at: 0, g: 0.085 }, { f: 990, at: 0.26, g: 0.05 }].forEach(function (note) {
      try {
        var o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
        o.type = "sine";
        o.frequency.setValueAtTime(note.f, t0 + note.at);
        o.frequency.exponentialRampToValueAtTime(note.f * 0.72, t0 + note.at + 0.45);
        lp.type = "lowpass"; lp.frequency.value = 2600;
        g.gain.setValueAtTime(0.0001, t0 + note.at);
        g.gain.exponentialRampToValueAtTime(note.g, t0 + note.at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + note.at + 0.55);
        o.connect(lp); lp.connect(g); g.connect(a.destination);
        o.start(t0 + note.at);
        o.stop(t0 + note.at + 0.62);
      } catch (e) {}
    });
  }

  function stopNoise() {
    if (!noiseSrc) return;
    try {
      var a = audio();
      noiseGain.gain.cancelScheduledValues(a.currentTime);
      noiseGain.gain.setValueAtTime(noiseGain.gain.value, a.currentTime);
      noiseGain.gain.linearRampToValueAtTime(0, a.currentTime + 0.35);
      noiseSrc.stop(a.currentTime + 0.45);
    } catch (e) {}
    noiseSrc = null; noiseGain = null;
  }

  // ------------------------------------------------------------------
  // camera + flashlight
  // ------------------------------------------------------------------
  var stream = null, track = null, torchOn = false, torchSupported = false;

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error("NO_API"));
    }
    return navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    }).then(function (s) {
      stream = s;
      video.srcObject = s;
      track = s.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      torchSupported = !!caps.torch;
      $("torchBtn").style.opacity = torchSupported ? "1" : "0.4";
      return video.play().catch(function () {});
    });
  }

  function setTorch(on) {
    if (!track || !torchSupported) return Promise.resolve(false);
    return track.applyConstraints({ advanced: [{ torch: !!on }] })
      .then(function () {
        torchOn = !!on;
        $("torchTxt").textContent = torchOn ? "ON" : "Light";
        $("torchBtn").style.borderColor = torchOn ? "rgba(255,230,120,.9)" : "rgba(160,195,240,.34)";
        return true;
      })
      .catch(function () { return false; });
  }

  // Keep the belly sharp. Not every phone exposes these, so everything is optional.
  function applyFocus(nx, ny) {
    if (!track || !track.getCapabilities || !track.applyConstraints) return;
    var caps;
    try { caps = track.getCapabilities() || {}; } catch (e) { return; }
    var adv = [];

    if (caps.focusMode) {
      var modes = caps.focusMode;
      if (modes.indexOf("continuous") >= 0) adv.push({ focusMode: "continuous" });
      else if (modes.indexOf("single-shot") >= 0) adv.push({ focusMode: "single-shot" });
    }
    // aim the focus (and metering, where supported) at the spot that was tapped
    if (nx != null && caps.pointsOfInterest) {
      var pt = [{ x: clamp(nx, 0, 1), y: clamp(ny, 0, 1) }];
      adv.push({ pointsOfInterest: pt });
      if (caps.exposureMode && caps.exposureMode.indexOf("continuous") >= 0) {
        adv.push({ exposureMode: "continuous" });
      }
    }
    if (!adv.length) return;
    try { track.applyConstraints({ advanced: adv }).catch(function () {}); } catch (e) {}
  }

  function stopCamera() {
    setTorch(false);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); }
    stream = null; track = null; video.srcObject = null;
  }

  // ------------------------------------------------------------------
  // FREEZE-FRAME  (hold the picture so you can show it to someone else)
  // ------------------------------------------------------------------
  var isFrozen = false, frozenFrame = null, torchBeforeFreeze = false;

  function drawCover(c, src, sw, sh, w, h, ox, oy, zoom) {
    if (!sw || !sh) return;
    var s = Math.max(w / sw, h / sh) * (zoom || 1);
    var dw = sw * s, dh = sh * s;
    c.drawImage(src, (w - dw) / 2 + (ox || 0), (h - dh) / 2 + (oy || 0), dw, dh);
  }

  // ------------------------------------------------------------------
  // MOTION SENSORS — moving the phone moves the picture, like a real probe
  // ------------------------------------------------------------------
  // Worms are anchored to a spot on the belly, not to the screen. The live
  // camera already shows the real movement, so all we do is shift the worms
  // the opposite way as the phone turns, which pins them in place.
  //
  // Orientation comes from beta/gamma, which are gravity-referenced and so
  // don't drift the way an integrated gyro would.
  var rawOri = { x: 0, y: 0 };      // degrees, straight off the sensor
  var ori = { x: 0, y: 0 };         // smoothed
  var oriRef = null;                // orientation when the worms were placed
  var camX = 0, camY = 0;           // how far the view has moved, in pixels
  var camTX = 0, camTY = 0;         // raw accumulated offset; camX eases toward it
  var trkTick = 0;
  // the spot on the belly we're locked onto — the match window follows it
  var anchorW = { x: 0, y: 0 };
  var frozenCam = { x: 0, y: 0 };
  var motionMag = 0, motionOn = false, motionAsked = false;

  // ==================================================================
  // OPTICAL FLOW TRACKING
  //
  // The gyroscope only sees rotation, but sliding a phone across a belly is
  // mostly translation — which is why gyro-only anchoring felt wrong. So we
  // track the camera picture itself: downscale each frame to a thumbnail and
  // find the shift that best lines it up with the previous one.
  //
  // Frames are zero-meaned before comparing, so the torch switching on or the
  // camera re-exposing doesn't get mistaken for movement.
  // ==================================================================
  var TW = 48, TH = 96;              // tracker thumbnail size (matches screen aspect)
  var trkCv = null, trkCtx = null;
  var trkPrev = null, trkCur = null;
  var trkHasPrev = false;
  var flowConf = 0;                  // 0..1, how much to trust the last estimate
  var flowTex = 0;                   // how much texture there is to track

  function trackerInit() {
    // Match the thumbnail to the screen's aspect ratio. A 4:3 thumbnail on a
    // tall phone would give plenty of horizontal resolution and almost none
    // vertically, which makes up-down tracking mushy.
    var aspect = (W && H) ? W / H : 0.5;
    TW = clamp(Math.round(Math.sqrt(3600 * aspect)), 32, 96);
    TH = clamp(Math.round(3600 / TW), 32, 128);

    trkCv = document.createElement("canvas");
    trkCv.width = TW; trkCv.height = TH;
    try { trkCtx = trkCv.getContext("2d", { willReadFrequently: true }); }
    catch (e) { trkCtx = trkCv.getContext("2d"); }

    trkPrev = new Int16Array(TW * TH);
    trkCur = new Int16Array(TW * TH);
    integ = null; mask = null; maskStack = null;   // sizes changed, rebuild lazily
    trackerResetFlow();
    maskValid = false;
  }

  // Reset only the motion state. Deliberately keeps the body mask and the
  // navel: reveal happens right after a scan that just worked those out, and
  // throwing them away means the worms get placed with no idea where the body
  // is — which is exactly when we need to know.
  function trackerResetFlow() {
    trkHasPrev = false;
    flowConf = 0;
  }

  function trackerGrab() {
    if (!trkCtx || !video.videoWidth) return false;
    var d;
    try {
      // Crop exactly the region that object-fit:cover shows on screen, so one
      // thumbnail pixel is a fixed number of screen pixels everywhere. Without
      // this, thumbnail coords only line up with the screen at dead centre.
      var vw = video.videoWidth, vh = video.videoHeight;
      var s = Math.max(W / vw, H / vh);
      var srcW = Math.min(vw, W / s), srcH = Math.min(vh, H / s);
      trkCtx.drawImage(video, (vw - srcW) / 2, (vh - srcH) / 2, srcW, srcH, 0, 0, TW, TH);
      d = trkCtx.getImageData(0, 0, TW, TH).data;
    } catch (e) { return false; }

    var n = TW * TH, sum = 0, i = 0, p = 0;
    for (; p < n; p++, i += 4) {
      var v = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;   // luminance
      trkCur[p] = v; sum += v;
    }
    var mean = sum / n;
    for (p = 0; p < n; p++) trkCur[p] -= mean;
    return true;
  }

  // MARGIN must exceed SEARCH so the shifted lookup can never leave the buffer
  var SEARCH = 6, MARGIN = 7;

  // The match window follows the anchor point rather than covering the whole
  // frame. Matching the patch you actually care about beats averaging in
  // clothing, furniture and whatever else is at the edges.
  var regX0 = MARGIN, regX1 = 1, regY0 = MARGIN, regY1 = 1;

  function setRegion(cx, cy, half) {
    regX0 = Math.max(MARGIN, Math.round(cx - half));
    regX1 = Math.min(TW - MARGIN, Math.round(cx + half));
    regY0 = Math.max(MARGIN, Math.round(cy - half));
    regY1 = Math.min(TH - MARGIN, Math.round(cy + half));
    // anchor drifted off-frame — fall back to matching everything
    if (regX1 - regX0 < 10) { regX0 = MARGIN; regX1 = TW - MARGIN; }
    if (regY1 - regY0 < 10) { regY0 = MARGIN; regY1 = TH - MARGIN; }
  }

  function sadAt(ox, oy) {
    var s = 0, n = 0;
    for (var y = regY0; y < regY1; y++) {
      var row = y * TW, prow = (y - oy) * TW;
      for (var x = regX0; x < regX1; x += 2) {
        var diff = trkCur[row + x] - trkPrev[prow + x - ox];
        s += diff < 0 ? -diff : diff;
        n++;
      }
    }
    return n ? s / n : 1e9;
  }

  // fit a parabola through three samples to get a sub-pixel minimum
  function subPixel(sm, s0, sp) {
    var den = sm - 2 * s0 + sp;
    if (Math.abs(den) < 1e-6) return 0;
    return clamp(0.5 * (sm - sp) / den, -1, 1);
  }

  // ------------------------------------------------------------------
  // NAVEL DETECTION
  //
  // The belly button is the one strong landmark on a belly: a small, round,
  // recessed patch that reads darker than the skin around it — especially with
  // the torch on. A centre-surround test finds it cheaply. Whatever scores
  // most strongly "dark blob on lighter background" is almost always it.
  // ------------------------------------------------------------------
  var integ = null;
  var navel = null;        // smoothed {x,y} in thumbnail coords
  var navelMiss = 0, navelAnnounced = false;
  // Auto-detection needs a shadowed navel to find. On a small child there often
  // isn't one, so the parent can just tap it instead — that always wins.
  var navelManual = null;  // {x,y} normalised 0..1, or null for auto

  function buildIntegral() {
    var IW = TW + 1;
    if (!integ) integ = new Float64Array(IW * (TH + 1));
    for (var i = 0; i < IW; i++) integ[i] = 0;
    for (var y = 0; y < TH; y++) {
      var rowSum = 0;
      integ[(y + 1) * IW] = 0;
      for (var x = 0; x < TW; x++) {
        rowSum += trkCur[y * TW + x];
        integ[(y + 1) * IW + x + 1] = integ[y * IW + x + 1] + rowSum;
      }
    }
  }

  function boxSum(x0, y0, x1, y1) {
    var IW = TW + 1;
    return integ[y1 * IW + x1] - integ[y0 * IW + x1] - integ[y1 * IW + x0] + integ[y0 * IW + x0];
  }

  // ------------------------------------------------------------------
  // BODY MASK
  //
  // With the torch on, the torso is the bright thing filling the middle of the
  // frame and the background falls away darker. Threshold on that, then keep
  // only the blob connected to the centre, and we have a rough body outline.
  // Worms get confined to it so they never crawl across the bedsheets.
  // ------------------------------------------------------------------
  var mask = null, maskTmp = null, maskStack = null, maskValid = false;

  // 3x3 majority vote: fills pinholes and shaves off speckle, so the outline
  // comes out as a line rather than confetti
  function despeckle() {
    if (!maskTmp || maskTmp.length !== mask.length) maskTmp = new Uint8Array(mask.length);
    maskTmp.set(mask);
    for (var y = 1; y < TH - 1; y++) {
      for (var x = 1; x < TW - 1; x++) {
        var p = y * TW + x;
        var n = maskTmp[p - TW - 1] + maskTmp[p - TW] + maskTmp[p - TW + 1] +
                maskTmp[p - 1]      + maskTmp[p]      + maskTmp[p + 1] +
                maskTmp[p + TW - 1] + maskTmp[p + TW] + maskTmp[p + TW + 1];
        mask[p] = n >= 5 ? 1 : 0;
      }
    }
  }

  function buildBodyMask() {
    var n = TW * TH, i;
    if (!mask || mask.length !== n) { mask = new Uint8Array(n); maskStack = new Int32Array(n); maskTmp = null; }

    var s2 = 0;
    for (i = 0; i < n; i++) s2 += trkCur[i] * trkCur[i];
    var sd = Math.sqrt(s2 / n) || 1;
    var thr = -TUNE.maskK * sd;     // trkCur is zero-mean, so 0 is average brightness

    for (i = 0; i < n; i++) mask[i] = trkCur[i] > thr ? 1 : 0;
    despeckle();
    despeckle();

    // seed at the centre, or the nearest lit pixel to it
    var cx = TW >> 1, cy = TH >> 1, seed = -1;
    for (var rad = 0; rad < 12 && seed < 0; rad++) {
      for (var dy = -rad; dy <= rad && seed < 0; dy++) {
        for (var dx = -rad; dx <= rad; dx++) {
          var x = cx + dx, y = cy + dy;
          if (x < 0 || y < 0 || x >= TW || y >= TH) continue;
          if (mask[y * TW + x] === 1) { seed = y * TW + x; break; }
        }
      }
    }
    if (seed < 0) { maskValid = false; return; }

    // flood fill outward from the seed
    var sp = 0, kept = 0;
    maskStack[sp++] = seed;
    mask[seed] = 2;
    while (sp > 0) {
      var p = maskStack[--sp];
      kept++;
      var px = p % TW, py = (p / TW) | 0;
      if (px > 0        && mask[p - 1]  === 1) { mask[p - 1]  = 2; maskStack[sp++] = p - 1; }
      if (px < TW - 1   && mask[p + 1]  === 1) { mask[p + 1]  = 2; maskStack[sp++] = p + 1; }
      if (py > 0        && mask[p - TW] === 1) { mask[p - TW] = 2; maskStack[sp++] = p - TW; }
      if (py < TH - 1   && mask[p + TW] === 1) { mask[p + TW] = 2; maskStack[sp++] = p + TW; }
    }
    for (i = 0; i < n; i++) mask[i] = mask[i] === 2 ? 1 : 0;

    // if it covers almost nothing or almost everything, it isn't telling us anything
    var frac = kept / n;
    dbg.maskFrac = frac;
    maskValid = frac > 0.12 && frac < 0.96;
  }

  // thumbnail-space test
  function onBodyT(tx, ty) {
    if (!maskValid) return true;
    var x = Math.round(tx), y = Math.round(ty);
    if (x < 0 || y < 0 || x >= TW || y >= TH) return false;
    return mask[y * TW + x] === 1;
  }

  // screen-space test
  function onBody(sx, sy) {
    if (!maskValid || !W || !H) return true;
    return onBodyT(sx / W * TW, sy / H * TH);
  }

  function detectNavel() {
    buildIntegral();
    var best = null;
    var sx0 = Math.round(TW * 0.22), sx1 = Math.round(TW * 0.78);
    var sy0 = Math.round(TH * 0.24), sy1 = Math.round(TH * 0.80);
    var radii = [3, 4, 5];

    for (var ri = 0; ri < radii.length; ri++) {
      var r = radii[ri], R = Math.round(r * 2.4);
      var iN = (2 * r + 1) * (2 * r + 1);
      var oN = (2 * R + 1) * (2 * R + 1);
      for (var y = sy0; y < sy1; y++) {
        if (y - R < 0 || y + R + 1 > TH) continue;
        for (var x = sx0; x < sx1; x++) {
          if (x - R < 0 || x + R + 1 > TW) continue;
          var iS = boxSum(x - r, y - r, x + r + 1, y + r + 1);
          var oS = boxSum(x - R, y - R, x + R + 1, y + R + 1);
          // Prefer candidates on the body, but don't let the mask veto them.
          // If the mask is wrong, a strong navel should still be able to win.
          var penalty = onBodyT(x, y) ? 0 : 3;
          var score = (iS / iN) - ((oS - iS) / (oN - iN)) + penalty;   // negative = darker than surroundings
          if (!best || score < best.score) best = { x: x, y: y, score: score };
        }
      }
    }
    dbg.navelScore = best ? best.score : 0;
    if (!best || best.score > TUNE.navelScore) return null;   // nothing convincingly blob-like
    return best;
  }

  // run periodically while scanning; smooths so the marker doesn't twitch
  function updateNavel() {
    if (!trackerGrab()) return;
    buildBodyMask();

    // A hand-placed navel is held exactly where it was put. Stored normalised
    // so it survives the thumbnail being resized.
    if (navelManual) {
      navel = { x: navelManual.x * TW, y: navelManual.y * TH };
      trkPrev.set(trkCur);
      trkHasPrev = true;
      return;
    }

    var hit = detectNavel();
    trkPrev.set(trkCur);
    trkHasPrev = true;
    if (hit) {
      navelMiss = 0;
      if (!navel) navel = { x: hit.x, y: hit.y };
      else { navel.x += (hit.x - navel.x) * 0.35; navel.y += (hit.y - navel.y) * 0.35; }
    } else if (navel && ++navelMiss > 12) {
      navel = null;
    }
  }

  // put the navel where the grown-up tapped
  function setNavelManual(sx, sy) {
    if (!W || !H) return;
    navelManual = { x: clamp(sx / W, 0, 1), y: clamp(sy / H, 0, 1) };
    navel = { x: navelManual.x * TW, y: navelManual.y * TH };
    navelMiss = 0;
    applyFocus(navelManual.x, navelManual.y);
  }

  function navelScreen() {
    if (!navel || !W || !H) return null;
    return { x: navel.x / TW * W, y: navel.y / TH * H };
  }

  // Measures the texture inside the current match window, so a bare patch of
  // skin doesn't get reported as a confident lock.
  function regionTexture() {
    var s = 0, n = 0;
    for (var y = regY0; y < regY1; y += 2) {
      var row = y * TW;
      for (var x = regX0; x < regX1; x += 2) {
        var v = trkCur[row + x];
        s += v < 0 ? -v : v;
        n++;
      }
    }
    return n ? s / n : 0;
  }

  // returns the image shift in thumbnail pixels, or null when unreliable
  function trackerEstimate(anchorTX, anchorTY) {
    if (!trackerGrab()) return null;
    setRegion(anchorTX, anchorTY, 13);
    if (!trkHasPrev) {
      trkPrev.set(trkCur); trkHasPrev = true;
      return null;
    }

    var best = 1e9, bx = 0, by = 0, total = 0, count = 0, oy, ox, s;

    // coarse pass on a step-2 grid
    for (oy = -SEARCH; oy <= SEARCH; oy += 2) {
      for (ox = -SEARCH; ox <= SEARCH; ox += 2) {
        s = sadAt(ox, oy);
        total += s; count++;
        if (s < best) { best = s; bx = ox; by = oy; }
      }
    }
    // refine to whole pixels around the winner
    for (oy = by - 1; oy <= by + 1; oy++) {
      for (ox = bx - 1; ox <= bx + 1; ox++) {
        if (ox < -SEARCH || ox > SEARCH || oy < -SEARCH || oy > SEARCH) continue;
        s = sadAt(ox, oy);
        if (s < best) { best = s; bx = ox; by = oy; }
      }
    }

    var avg = count ? total / count : 1;
    flowConf = avg > 0 ? clamp((avg - best) / avg, 0, 1) : 0;
    flowTex = regionTexture();

    var dx = bx, dy = by;
    // sub-pixel polish, so slow drags don't move in 6px steps
    if (bx > -SEARCH && bx < SEARCH) dx += subPixel(sadAt(bx - 1, by), best, sadAt(bx + 1, by));
    if (by > -SEARCH && by < SEARCH) dy += subPixel(sadAt(bx, by - 1), best, sadAt(bx, by + 1));

    trkPrev.set(trkCur);

    dbg.dx = dx; dbg.dy = dy;
    // a blank, textureless view gives a meaningless "match" — ignore it
    if (flowTex < TUNE.flowTex || flowConf < TUNE.flowConf) return null;
    return { x: dx, y: dy };
  }

  function onOrient(e) {
    if (e.gamma == null && e.beta == null) return;
    motionOn = true;
    rawOri.x = e.gamma || 0;   // roll: left / right
    rawOri.y = e.beta || 0;    // pitch: up / down
  }

  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a) return;
    motionOn = true;
    var m = Math.sqrt((a.x || 0) * (a.x || 0) + (a.y || 0) * (a.y || 0) + (a.z || 0) * (a.z || 0));
    motionMag = motionMag * 0.85 + clamp(Math.abs(m - 9.81) / 6, 0, 1) * 0.15;
  }

  function enableMotion() {
    if (motionAsked) return;
    motionAsked = true;
    var DO = window.DeviceOrientationEvent, DM = window.DeviceMotionEvent;
    function attach() {
      window.addEventListener("deviceorientation", onOrient, true);
      window.addEventListener("devicemotion", onMotion, true);
    }
    // iOS needs an explicit prompt from inside a tap; Android just works.
    if (DO && typeof DO.requestPermission === "function") {
      DO.requestPermission().then(function (r) { if (r === "granted") attach(); }).catch(function () {});
      if (DM && typeof DM.requestPermission === "function") DM.requestPermission().catch(function () {});
    } else {
      attach();
    }
  }

  function updateMotion(dt) {
    var k = Math.min(1, dt * 9);
    ori.x += (rawOri.x - ori.x) * k;
    ori.y += (rawOri.y - ori.y) * k;

    // the hiss swells a little when the probe is moving
    if (noiseGain) {
      try { noiseGain.gain.value = clamp(0.04 + motionMag * 0.06, 0, 0.11); } catch (e) {}
    }

    if (isFrozen) { camX = frozenCam.x; camY = frozenCam.y; return; }

    // While scanning we're not anchoring anything yet — we're hunting for the
    // navel so there's something solid to lock onto when the worms appear.
    if (MODE === "scanning") {
      trkTick++;
      if (trkTick % 5 === 0) {
        var had = !!navel;
        updateNavel();
        var ns = navelScreen();
        if (ns && !had && !navelAnnounced) {
          navelAnnounced = true;
          shakeUntil = 0;
          scanMsgIdx = -1;
          setStatus("Belly button found 🎯 hold it there");
          buzz(30);
        }
        if (ns && trkTick % 40 === 0) applyFocus(ns.x / (W || 1), ns.y / (H || 1));
      }
      camX = 0; camY = 0;
      return;
    }

    if (!oriRef) { camX = 0; camY = 0; return; }

    // Tracking runs at ~30Hz; accumulating into a target and easing toward it
    // means a skipped frame costs nothing and jitter gets smoothed out without
    // losing any of the real displacement.
    trkTick++;
    if ((trkTick & 1) === 0) {
      // where the locked-on spot currently sits, in thumbnail coordinates
      var asx = anchorW.x - camX, asy = anchorW.y - camY;
      var f = trackerEstimate(asx / (W || 1) * TW, asy / (H || 1) * TH);
      // keep the mask fresh while the debug view is up
      if (TUNE.showMask) buildBodyMask();
      if (f) {
        camTX -= f.x * (W / TW);
        camTY -= f.y * (H / TH);
        camTX = clamp(camTX, -W * 1.6, W * 1.6);
        camTY = clamp(camTY, -H * 1.6, H * 1.6);
      }
    }
    var e = Math.min(1, dt * 14);
    camX += (camTX - camX) * e;
    camY += (camTY - camY) * e;
  }

  // call when the worms are placed — "here is where the belly is"
  function resetOrientationRef() {
    oriRef = { x: ori.x, y: ori.y };
    camX = 0; camY = 0; camTX = 0; camTY = 0;
    // lock onto the navel if we found one — it's the most trackable thing
    // on a belly, and it stops the worms sliding around
    var ns = navelScreen();
    anchorW.x = ns ? ns.x : W * 0.5;
    anchorW.y = ns ? ns.y : H * 0.5;
    if (ns) applyFocus(ns.x / (W || 1), ns.y / (H || 1));
    trackerResetFlow();
  }

  // lock onto a new spot: focus there, and match there
  function lockOnto(sx, sy) {
    anchorW.x = sx + camX;
    anchorW.y = sy + camY;
  }

  // screen position <-> belly ("world") position
  function toWorld(sx, sy) { return { x: sx + camX, y: sy + camY }; }

  function setFrozen(on) {
    if (on) {
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) { setStatus("Camera isn't ready yet…"); return; }
      frozenFrame = document.createElement("canvas");
      frozenFrame.width = vw; frozenFrame.height = vh;
      frozenFrame.getContext("2d").drawImage(video, 0, 0, vw, vh);
      isFrozen = true;
      frozenCam.x = camX; frozenCam.y = camY;   // lock the anchoring too
      torchBeforeFreeze = torchOn;
      setTorch(false);
      setStatus("Picture held ❄️ — take the phone off and show them!");
    } else {
      isFrozen = false; frozenFrame = null;
      if (torchBeforeFreeze) setTorch(true);
      setStatus("Live again — point at the belly.");
    }
    $("freezeTxt").textContent = isFrozen ? "Live" : "Hold";
    $("freezeBtn").firstChild.nodeValue = isFrozen ? "▶️ " : "❄️ ";
    $("freezeBtn").style.borderColor = isFrozen ? "rgba(150,220,255,.9)" : "rgba(160,195,240,.34)";
    buzz(25);
  }

  // ------------------------------------------------------------------
  // SAVED SCANS  (kept on the phone so the other kid can see it later)
  // ------------------------------------------------------------------
  var STORE = "bellyScans.v1", MAX_SHOTS = 8;

  function loadShots() {
    try { return JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) { return []; }
  }
  function persistShots(list) {
    try { localStorage.setItem(STORE, JSON.stringify(list)); return true; } catch (e) { return false; }
  }
  function updateGalCount() { $("galcount").textContent = loadShots().length; }

  function exportComposite() {
    var s = Math.min(2, 900 / Math.max(1, W));
    var cv = document.createElement("canvas");
    cv.width = Math.round(W * s); cv.height = Math.round(H * s);
    var c = cv.getContext("2d");
    c.setTransform(s, 0, 0, s, 0, 0);
    var t = performance.now() / 1000;
    renderScan(c, W, H, t, { beam: false, worms: true });
    // caption strip
    var alive = worms.filter(function (w) { return !w.dying; }).length;
    c.fillStyle = "rgba(0,0,0,.66)"; c.fillRect(0, H - 46, W, 46);
    c.fillStyle = "#dfeaff";
    c.font = "bold 20px Verdana, sans-serif";
    c.textAlign = "left";
    c.textBaseline = "middle";
    c.fillText("🪱 " + alive + " worms detected", 14, H - 23);
    return cv.toDataURL("image/jpeg", 0.72);
  }

  function saveScan() {

    var img;
    try { img = exportComposite(); } catch (e) { setStatus("Couldn't save that one 😕", "bad"); return; }
    var list = loadShots();
    list.unshift({

    });

    var ok = persistShots(list);
    while (!ok && list.length > 1) { list.pop(); ok = persistShots(list); }
    updateGalCount();
    flash("#ffffff");
    buzz(40);
    setStatus(ok ? "Saved 📁 — you can show this one again later!" : "Phone storage is full, couldn't save.", ok ? "good" : "bad");
