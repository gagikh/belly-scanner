  // ------------------------------------------------------------------
  // the ultrasound "cone" — worms live inside this shape
  // ------------------------------------------------------------------
  function coneParams(w, h) {
    return {
      // ~62 degrees each side of straight down: a wide, shallow fan.
      // rOut stops short of the bottom so the curved lower edge stays visible —
      // without it the shape just reads as a rectangle with clipped corners.
      ax: w / 2, ay: -h * 0.09,
      a0: Math.PI / 2 - 1.00, a1: Math.PI / 2 + 1.00,
      rIn: h * 0.17, rOut: h * 0.95
    };
  }

  function insideCone(x, y, pad) {
    if (!W || !H) return true;
    var k = coneParams(W, H);
    pad = pad || 0;
    var dx = x - k.ax, dy = y - k.ay;
    var r = Math.sqrt(dx * dx + dy * dy);
    if (r < k.rIn + pad || r > k.rOut - pad) return false;
    var a = Math.atan2(dy, dx);
    var ang = pad / Math.max(r, 1);
    if (a < k.a0 + ang || a > k.a1 - ang) return false;
    return y > pad + 60 && y < H - pad - 30;
  }

  function spawnPoint() {
    // if we found the navel, put the worms in orbit around it — that's where a
    // kid expects the inside of their tummy to be
    var ns = navelScreen();
    var i, x, y;
    if (ns) {
      for (i = 0; i < 80; i++) {
        var a = rand(0, 6.2832), r = rand(55, 135);
        x = ns.x + Math.cos(a) * r;
        y = ns.y + Math.sin(a) * r;
        if (insideCone(x, y, 40) && onBody(x, y)) return { x: x, y: y };
      }
    }
    for (i = 0; i < 80; i++) {
      x = rand(W * 0.16, W * 0.84);
      y = rand(H * 0.30, H * 0.74);
      if (insideCone(x, y, 40) && onBody(x, y)) return { x: x, y: y };
    }
    for (i = 0; i < 40; i++) {      // last resort: ignore the mask
      x = rand(W * 0.16, W * 0.84);
      y = rand(H * 0.30, H * 0.74);
      if (insideCone(x, y, 40)) return { x: x, y: y };
    }
    return { x: W / 2, y: H * 0.5 };
  }

  // ------------------------------------------------------------------
  // WORMS
  // ------------------------------------------------------------------
  function Worm(x, y) {
    var sp = spawnPoint();
    // positions are in belly ("world") space, not screen space
    var p = toWorld(x != null ? x : sp.x, y != null ? y : sp.y);
    this.x = p.x;
    this.y = p.y;
    this.homeX = p.x;          // the spot on the belly it belongs to
    this.homeY = p.y;
    this.roam = rand(26, 46);  // how far it will stray from that spot
    this.dir = rand(0, Math.PI * 2);
    this.speed = rand(16, 40);
    this.nSeg = randInt(12, 18);
    this.segLen = rand(7, 10.5);
    this.thick = rand(9, 15);
    this.hue = rand(64, 104);
    this.sat = rand(34, 52);
    this.phase = rand(0, Math.PI * 2);
    this.wig = rand(2.0, 3.4);
    this.grow = 0;              // 0 -> 1 pop-in
    this.dying = 0;             // 0 -> 1 fade-out
    this.dead = false;
    this.pts = [];
    for (var i = 0; i < this.nSeg; i++) this.pts.push({ x: this.x, y: this.y });
  }

  Worm.prototype.kill = function () { if (!this.dying) this.dying = 0.0001; };

  Worm.prototype.update = function (dt, t) {
    if (this.grow < 1) this.grow = Math.min(1, this.grow + dt * 2.6);
    if (this.dying) {
      this.dying = Math.min(1, this.dying + dt * 1.5);
      this.y -= dt * 42;
      if (this.dying >= 1) this.dead = true;
    }

    // wander: sine wiggle + gentle random steering
    this.dir += Math.sin(t * this.wig + this.phase) * dt * 2.4 + rand(-0.6, 0.6) * dt;

    // stay around the spot it was pinned to
    if (!this.dying) {
      var hx = this.homeX - this.x, hy = this.homeY - this.y;
      var hd = Math.sqrt(hx * hx + hy * hy);
      if (hd > this.roam) {
        var toHome = Math.atan2(hy, hx);
        var dh = Math.atan2(Math.sin(toHome - this.dir), Math.cos(toHome - this.dir));
        var pull = Math.min(1, (hd - this.roam) / 50);
        this.dir += clamp(dh, -1.2, 1.2) * pull * dt * 7;
        if (hd > this.roam * 3) this.dir = toHome;   // yanked far away: head straight back
      }
    }

    // No beam-edge steering here: the home tether already keeps a worm in a
    // small patch, and pushing it back toward screen centre would undo the
    // anchoring the moment you moved the phone.
    this.x += Math.cos(this.dir) * this.speed * dt;
    this.y += Math.sin(this.dir) * this.speed * dt;

    // body follows the head with fixed segment spacing
    var px = this.x, py = this.y;
    for (var i = 0; i < this.pts.length; i++) {
      var p = this.pts[i];
      var dx = px - p.x, dy = py - p.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d > this.segLen) {
        p.x += dx * (d - this.segLen) / d;
        p.y += dy * (d - this.segLen) / d;
      }
      px = p.x; py = p.y;
    }
  };

  Worm.prototype.draw = function (c, t) {
    var pop = this.grow * this.grow * (3 - 2 * this.grow);   // smoothstep
    var alpha = (1 - this.dying) * pop;
    if (alpha <= 0.01) return;
    var scale = pop * (1 - this.dying * 0.4);

    var spine = [{ x: this.x, y: this.y }].concat(this.pts);
    var n = spine.length;

    c.save();
    c.globalAlpha = alpha;

    // soft shadow under the worm
    c.save();
    c.globalAlpha = alpha * 0.3;
    c.fillStyle = "#000";
    for (var s = 0; s < n; s += 2) {
      var tp = 1 - Math.pow(s / n, 1.7);
      c.beginPath();
      c.arc(spine[s].x + 2.5, spine[s].y + 4, Math.max(0.5, this.thick * tp * scale), 0, 6.2832);
      c.fill();
    }
    c.restore();

    // body — rendered like tissue on an ultrasound: pale, speckled, dark-edged
    c.lineJoin = "round";
    for (var i = n - 1; i >= 0; i--) {
      var taper = 1 - Math.pow(i / n, 1.7);
      var r = Math.max(0.6, this.thick * taper * scale);
      var lit = 62 + 16 * Math.sin(i * 0.9 + t * 5);
      c.fillStyle = "hsl(210,6%," + lit + "%)";
      c.beginPath();
      c.arc(spine[i].x, spine[i].y, r, 0, 6.2832);
      c.fill();
      // segment edge
      c.strokeStyle = "rgba(10,14,20,0.55)";
      c.lineWidth = Math.max(0.6, r * 0.16);
      c.stroke();

      // bright echo highlight
      c.fillStyle = "rgba(248,250,255,0.5)";
      c.beginPath();
      c.arc(spine[i].x - r * 0.3, spine[i].y - r * 0.36, Math.max(0.4, r * 0.34), 0, 6.2832);
      c.fill();

      // tiny leg bristles, like the caterpillar in an ultrasound
      if (i % 2 === 0 && i < n - 2) {
        var nx = spine[i].x - spine[i + 1].x, ny = spine[i].y - spine[i + 1].y;
        var nl = Math.sqrt(nx * nx + ny * ny) || 1;
        var lx = -ny / nl, ly = nx / nl;
        c.strokeStyle = "rgba(236,242,250,0.75)";
        c.lineWidth = Math.max(0.7, r * 0.16);
        c.lineCap = "round";
        for (var sgn = -1; sgn <= 1; sgn += 2) {
          var wob = Math.sin(t * 7 + i * 1.3 + (sgn > 0 ? 0 : 1.6)) * 0.28;
          c.beginPath();
          c.moveTo(spine[i].x + lx * r * 0.8 * sgn, spine[i].y + ly * r * 0.8 * sgn);
          c.lineTo(spine[i].x + (lx * sgn + wob) * r * 1.75, spine[i].y + (ly * sgn + wob) * r * 1.75);
          c.stroke();
        }
      }
    }

    // head
    var hx = this.x, hy = this.y, hr = this.thick * scale;
    var ca = Math.cos(this.dir), sa = Math.sin(this.dir);
    var perpX = -sa, perpY = ca;

    c.fillStyle = "hsl(210,6%,74%)";
    c.beginPath(); c.arc(hx, hy, hr * 1.12, 0, 6.2832); c.fill();
    c.strokeStyle = "rgba(10,14,20,0.55)";
    c.lineWidth = Math.max(0.7, hr * 0.14); c.stroke();

    // eyes
    var blink = (Math.sin(t * 1.6 + this.phase) > 0.965) ? 0.18 : 1;
    for (var e = -1; e <= 1; e += 2) {
      var ex = hx + ca * hr * 0.42 + perpX * hr * 0.46 * e;
      var ey = hy + sa * hr * 0.42 + perpY * hr * 0.46 * e;
      c.fillStyle = "#fdfff4";
      c.beginPath(); c.ellipse(ex, ey, hr * 0.36, hr * 0.36 * blink, 0, 0, 6.2832); c.fill();
      if (blink > 0.5) {
        c.fillStyle = "#141414";
        c.beginPath(); c.arc(ex + ca * hr * 0.12, ey + sa * hr * 0.12, hr * 0.18, 0, 6.2832); c.fill();
      }
    }

    // little grumpy mouth
    c.strokeStyle = "rgba(20,10,10,.75)";
    c.lineWidth = Math.max(1, hr * 0.17);
    c.lineCap = "round";
    c.beginPath();
    c.arc(hx + ca * hr * 0.55, hy + sa * hr * 0.55, hr * 0.34, this.dir - 2.5, this.dir - 0.6);
    c.stroke();

    c.restore();
  };

  // ------------------------------------------------------------------
  // particles (sparkles when a worm leaves)
  // ------------------------------------------------------------------
  var parts = [];
  function burst(x, y, color, n) {
    for (var i = 0; i < (n || 14); i++) {
      var a = rand(0, 6.2832), sp = rand(50, 220);
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 1, col: color, r: rand(2, 5) });
    }
  }
  function updateParts(dt) {
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.life -= dt * 1.5;
      p.vy += 380 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
  }
  function drawParts(c) {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      c.globalAlpha = clamp(p.life, 0, 1);
      c.fillStyle = p.col;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.2832); c.fill();
    }
    c.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // game state
  // ------------------------------------------------------------------
  var MODE = "idle";        // idle | scanning | play | win
  var worms = [];
  var scanT = 0;
  var REVEAL_DELAY = 1.6;      // how long before the SEE INSIDE button appears
  var scanMsgIdx = -1, shakeUntil = 0, navelHintUntil = 0;
  var SCAN_LINES = [
    "👆 Tap the belly button to mark it",
    "SCANNING… move slowly over the belly",
    "Analysing tummy contents… 🔬",
    "👆 Wrong spot? Tap the right one",
    "Hmm. Something is moving in there…",
    "Detecting wrigglers… hold still!"
  ];
  var lastTime = 0, running = false;
  var perfAcc = 0, perfN = 0;

  // ---- the day's diet, ticked off by a grown-up before the scan ----
  var FOODS = [
    { e: "🥦", n: "veggies", junk: false },
    { e: "🍎", n: "fruit",   junk: false },
    { e: "💧", n: "water",   junk: false },
    { e: "🥕", n: "carrots", junk: false },
    { e: "🍓", n: "berries", junk: false },
    { e: "🍚", n: "proper meal", junk: false },
    { e: "🥤", n: "cola",    junk: true },
    { e: "🍟", n: "chips",   junk: true },
    { e: "🍬", n: "candy",   junk: true },
    { e: "🍩", n: "donut",   junk: true },
    { e: "🍔", n: "burger",  junk: true },
    { e: "🍦", n: "ice cream", junk: true }
  ];
  var eaten = [];   // the FOODS entries that were ticked

  function junkEaten() { return eaten.filter(function (f) { return f.junk; }); }
  function goodEaten() { return eaten.filter(function (f) { return !f.junk; }); }

  // ------------------------------------------------------------------
  // THE STREAK
  //
  // The worms carry over between days. A good day (at most one sugary thing)
  // sends one away; a bad day brings one back. Never more than two, and a bad
  // day costs a single day of progress rather than wiping the lot — the point
  // is "you can fix this tomorrow", not "you ruined it".
  // ------------------------------------------------------------------
  var MAX_WORMS = 2;
  var STREAK_KEY = "bellyStreak.v1";

  // ------------------------------------------------------------------
  // WHO'S BEING SCANNED
  //
  // With more than one child a single shared streak is worse than none —
  // scanning the second kid would quietly wreck the first one's progress.
  // Every child gets their own history, chosen before the scan.
  // ------------------------------------------------------------------
  var PROFILE_KEY = "bellyProfiles.v1";
  var FACES = ["🦊", "🐻", "🐰", "🐨", "🐯", "🦁", "🐼", "🐸"];
  var profiles = { list: [], activeId: null };

  // Date.now() alone collides if two profiles are made in the same millisecond,
  // and two children sharing an id means two children sharing a streak.
  function newProfileId() {
    var id, guard = 0;
    do {
      id = "k" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    } while (guard++ < 20 && profiles.list.some(function (p) { return p.id === id; }));
    return id;
  }

  function loadProfiles() {
    try {
      var p = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
      if (p && Array.isArray(p.list)) profiles = p;
    } catch (e) {}
    if (!profiles.list.length) {
      profiles.list = [{ id: newProfileId(), name: "Kid 1", face: FACES[0] }];
      profiles.activeId = profiles.list[0].id;
      saveProfiles();
    }
    if (!activeProfile()) profiles.activeId = profiles.list[0].id;
  }
  function saveProfiles() {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profiles)); } catch (e) {}
  }
  function activeProfile() {
    for (var i = 0; i < profiles.list.length; i++) {
      if (profiles.list[i].id === profiles.activeId) return profiles.list[i];
    }
    return null;
  }
  function activeName() {
    var p = activeProfile();
    return p ? p.name : "Kid";
  }
  function addProfile() {
    if (profiles.list.length >= 6) return;
    var n = (window.prompt("Who else is getting scanned?", "Kid " + (profiles.list.length + 1)) || "").trim();
    if (!n) return;
    var p = { id: newProfileId(), name: n.slice(0, 14), face: FACES[profiles.list.length % FACES.length] };
    profiles.list.push(p);
    profiles.activeId = p.id;
    saveProfiles();
    renderProfiles();
    updateHomeState();
  }
  function editProfile(p) {
    var n = window.prompt("Rename (or clear the box to remove)", p.name);
    if (n === null) return;
    n = n.trim();
    if (!n) {
      if (profiles.list.length <= 1) return;                 // always keep one
      if (!window.confirm("Remove " + p.name + " and their progress?")) return;
      profiles.list = profiles.list.filter(function (x) { return x.id !== p.id; });
      try { localStorage.removeItem(STREAK_KEY + "." + p.id); } catch (e) {}
      if (profiles.activeId === p.id) profiles.activeId = profiles.list[0].id;
    } else {
      p.name = n.slice(0, 14);
    }
    saveProfiles(); renderProfiles(); updateHomeState();
  }

  function renderProfiles() {
    var box = $("who");
    if (!box) return;
    box.innerHTML = "";
    profiles.list.forEach(function (p) {
      var b = document.createElement("button");
      b.className = "kid" + (p.id === profiles.activeId ? " on" : "");
      b.innerHTML = '<span class="face">' + p.face + '</span><span class="kname">' + p.name + '</span>';
      b.addEventListener("click", function () {
        profiles.activeId = p.id; saveProfiles(); renderProfiles(); updateHomeState(); buzz(15);
      });
      // long-press to rename or remove
      var t = null;
      b.addEventListener("pointerdown", function () {
        t = setTimeout(function () { editProfile(p); buzz(40); }, 650);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) {
        b.addEventListener(ev, function () { clearTimeout(t); });
      });
      box.appendChild(b);
    });
    var add = document.createElement("button");
    add.className = "kid add";
    add.innerHTML = '<span class="face">＋</span><span class="kname">add</span>';
    add.addEventListener("click", addProfile);
    box.appendChild(add);
  }

  // each child's streak lives under its own key
  function streakKey() { return STREAK_KEY + "." + (profiles.activeId || "default"); }

  function dateKey(d) {
    d = d || new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }

  function blankStreak() {
    return { level: null, levelBefore: null, goodRun: 0, goodRunBefore: 0, bestRun: 0, lastDate: null, days: [] };
  }

  function loadStreak() {
    try {
      // one-time move of the old single-child store onto the first profile
      var legacy = localStorage.getItem(STREAK_KEY);
      if (legacy && !localStorage.getItem(streakKey())) {
        localStorage.setItem(streakKey(), legacy);
        localStorage.removeItem(STREAK_KEY);
      }
      var s = JSON.parse(localStorage.getItem(streakKey()) || "null");
      if (s && typeof s === "object") {
        var b = blankStreak();
        for (var k in b) if (!(k in s)) s[k] = b[k];
        if (!Array.isArray(s.days)) s.days = [];
        return s;
      }
    } catch (e) {}
    return blankStreak();
  }

  function saveStreak(s) {
    try { localStorage.setItem(streakKey(), JSON.stringify(s)); } catch (e) {}
  }

  function isGoodDay(junkCount) { return junkCount <= 1; }

  // Works out today's worm count from the diet plus what carried over.
  // Re-running it for the same day recomputes from that day's starting point,
  // so re-scanning after fixing the food list does the right thing.
  var todayResult = null;

  function applyDiet() {
    var st = loadStreak();
    var today = dateKey();
    var junk = junkEaten().length;
    var good = isGoodDay(junk);

    if (st.lastDate !== today) {
      st.levelBefore = st.level;              // null on the very first run
      st.goodRunBefore = st.goodRun;
      st.lastDate = today;
    }

    var before = st.levelBefore;
    if (before === null || before === undefined) {
      // first ever scan: start from what they ate today
      st.level = junk === 0 ? 0 : (junk >= 3 ? MAX_WORMS : 1);
    } else {
      st.level = clamp(before + (good ? -1 : 1), 0, MAX_WORMS);
    }
    st.goodRun = good ? st.goodRunBefore + 1 : 0;
    st.bestRun = Math.max(st.bestRun || 0, st.goodRun);

    st.days = st.days.filter(function (d) { return d.d !== today; });
    st.days.push({ d: today, junk: junk, level: st.level });
    if (st.days.length > 30) st.days = st.days.slice(-30);

    saveStreak(st);
    todayResult = {
      before: before,
      after: st.level,
      good: good,
      junk: junk,
      goodRun: st.goodRun,
      first: before === null || before === undefined
    };
    return todayResult;
  }

  function wormTarget() {
    return todayResult ? todayResult.after : 0;
  }

  // short line for the home screen
  function streakLine() {
    var st = loadStreak();
    if (st.level === null) return "First scan — let's see what's in there.";
    var bits = [];
    bits.push(st.level === 0 ? "✨ Tummy is clear"
                             : "🪱 " + st.level + (st.level === 1 ? " worm" : " worms") + " in there");
    if (st.goodRun > 0) bits.push("🔥 " + st.goodRun + " good " + (st.goodRun === 1 ? "day" : "days") + " in a row");
    return bits.join("  ·  ");
  }

  function listNames(arr) {
    var n = arr.map(function (f) { return f.n; });
    if (n.length === 0) return "";
    if (n.length === 1) return n[0];
    return n.slice(0, -1).join(", ") + " and " + n[n.length - 1];
  }

  var FACTS = [
    "Sugary drinks feed the unhelpful bugs in your tummy. Water and fruit feed the good ones instead.",
    "Your tummy has billions of tiny helpers living in it. Veggies feed the helpers — sugar feeds the troublemakers.",
    "One glass of cola has roughly 9 spoonfuls of sugar in it. Your tummy notices.",
    "Crunchy fruit and vegetables work a bit like a broom for your insides."
  ];

  function setStatus(text, kind) {
    var el = $("status");
    if (el.textContent === text) return;      // don't re-animate an unchanged message
    el.textContent = text;
    el.className = kind || "";
    el.classList.remove("pop");
    void el.offsetWidth;                      // force reflow so the animation replays
    el.classList.add("pop");
  }

  function updateCount() {
    var alive = worms.filter(function (w) { return !w.dying; }).length;
    $("countnum").textContent = alive;
    return alive;
  }

  function flash(color) {
    var f = $("flash");
    f.style.background = color;
    f.style.opacity = "0.42";
    setTimeout(function () { f.style.opacity = "0"; }, 130);
  }

  // ---- the "what did you eat today?" checklist ----
  function buildDiet() {
    var box = $("dietFoods");
    box.innerHTML = "";
    eaten = [];
    FOODS.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "food";
      b.innerHTML = '<span class="emoji">' + f.e + '</span><span class="name">' + f.n + '</span>';
      b.addEventListener("click", function () {
        var i = eaten.indexOf(f);
        if (i >= 0) { eaten.splice(i, 1); b.classList.remove("on"); }
        else { eaten.push(f); b.classList.add("on"); }
        buzz(15);
        updateTally();
      });
      box.appendChild(b);
    });
    updateTally();
  }

  function updateTally() {
    var el = $("dietTally");
    if (!eaten.length) { el.textContent = "Nothing ticked yet."; return; }
    var j = junkEaten().length;
    el.textContent = eaten.length + " ticked · " +
      (j === 0 ? "all good stuff ✅" : j + " sugary/greasy") +
      (isGoodDay(j) ? "  →  good day ✅" : "  →  sugary day");
  }

  // ---- the verdict, shown after the reveal ----
  function showResult() {
    MODE = "result";
    stopNoise();
    setTorch(false);
    keepAwake(false);
    $("hud").classList.add("hidden");

    var res = todayResult || { before: null, after: worms.length, good: true, junk: 0, goodRun: 0, first: true };
    var n = res.after, j = junkEaten(), g = goodEaten();
    var r = $("result");
    var who = activeName();
    var head, body;

    // what changed since the last scan is the whole point — lead with it
    if (res.first) {
      head = n === 0 ? "TUMMY IS CLEAR!" : (n === 1 ? "ONE WRIGGLER" : "TWO WRIGGLERS");
      body = n === 0
        ? "Nothing wriggling in " + who + "'s tummy at all. Keep eating like today and it stays that way."
        : "Today " + who + " had <b>" + listNames(j) + "</b> — that's exactly what wrigglers like to eat.";
    } else if (res.after < res.before) {
      head = n === 0 ? "THEY'RE ALL GONE! 🎉" : "ONE LEFT! 🎉";
      body = who + " had a good day, so one wriggler packed up and left."
           + (g.length ? " The <b>" + listNames(g) + "</b> did that." : "")
           + (n > 0 ? "<br><br>One more good day and the last one goes too." : "");
    } else if (res.after > res.before) {
      head = n === 1 ? "ONE MOVED IN" : "ANOTHER ONE MOVED IN";
      body = "Today " + who + " had <b>" + listNames(j) + "</b>, and that brought a wriggler back."
           + "<br><br>Nothing is ruined — one good day tomorrow and it leaves again.";
    } else if (n === 0) {
      head = "STILL CLEAR! ✨";
      body = "Another good day. Nothing has moved in.";
    } else {
      head = n === 1 ? "STILL ONE IN THERE" : "STILL TWO IN THERE";
      body = "No change today." + (j.length ? " There was still <b>" + listNames(j) + "</b>." : "")
           + "<br><br>One day with no more than one sugary thing and one of them leaves.";
    }

    if (res.goodRun > 1) {
      body += "<br><br>🔥 <b>" + res.goodRun + " good days in a row.</b>";
    }
    body += "<br><br>" + pick(FACTS);

    r.classList.toggle("clean", n === 0);
    $("resultEmoji").textContent = n === 0 ? "✨" : (res.after < res.before ? "🎉" : "🪱");
    $("resultTitle").textContent = head;
    $("resultBody").innerHTML = body;
    r.classList.remove("hidden");
    updateHomeState();
    buzz(60);
  }

  function updateHomeState() {
    var el = $("homeState");
    if (el) el.textContent = streakLine();
  }

  // ==================================================================
  // ULTRASOUND RENDERER
  // greyscale camera feed inside a sector "cone", speckle grain,
  // depth ruler and fake machine readouts down the side.
  // ==================================================================
  var noiseTile = null, noisePat = null;

  function makeNoise() {
    try {
      var n = document.createElement("canvas");
      n.width = n.height = 96;
      var nc = n.getContext("2d");
      var id = nc.createImageData(96, 96);
      for (var i = 0; i < id.data.length; i += 4) {
        var v = Math.random() * 255;
        id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
        id.data[i + 3] = 46;
      }
      nc.putImageData(id, 0, 0);
      noiseTile = n;
    } catch (e) { noiseTile = null; }
  }

  // Builds the fan/sector shape. addRect=true makes an even-odd "everything
  // outside the fan" path so we can black out the corners.
  function conePath(c, w, h, addRect) {
    var k = coneParams(w, h);
    var ax = k.ax, ay = k.ay, a0 = k.a0, a1 = k.a1, rIn = k.rIn, rOut = k.rOut;
    c.beginPath();
    if (addRect) c.rect(0, 0, w, h);
    c.moveTo(ax + Math.cos(a0) * rIn, ay + Math.sin(a0) * rIn);
    c.arc(ax, ay, rIn, a0, a1);
    c.arc(ax, ay, rOut, a1, a0, true);
    c.closePath();
    return { ax: ax, ay: ay, a0: a0, a1: a1, rIn: rIn, rOut: rOut };
  }

  // greyscale camera frame, cover-fitted
  function drawFeed(c, w, h) {
    c.save();
    c.fillStyle = "#04060a";
    c.fillRect(0, 0, w, h);
    try {
      // extra zoom leaves room to pan the image as the phone tilts.
      // canvas blur is the most expensive bit, so it's dropped on slow phones
      // and only used at all when the probe is actually moving.
      // The feed is NOT panned. It's a live camera — it already moves when the
      // phone moves. Faking a shift on top of that fights the real image.
      var base = "grayscale(1) contrast(1.5) brightness(0.82)";
      var blur = lowQ ? 0 : 0.4 + motionMag * 1.6;
      c.filter = blur > 0.05 ? base + " blur(" + blur.toFixed(2) + "px)" : base;
      if (isFrozen && frozenFrame) drawCover(c, frozenFrame, frozenFrame.width, frozenFrame.height, w, h);
      else if (video.videoWidth) drawCover(c, video, video.videoWidth, video.videoHeight, w, h);
      c.filter = "none";
    } catch (e) { c.filter = "none"; }
    c.restore();
  }

  function drawSpeckle(c, w, h, t) {
    if (!noiseTile) makeNoise();
    if (noiseTile && !noisePat) { try { noisePat = c.createPattern(noiseTile, "repeat"); } catch (e) { noisePat = null; } }
    if (!noisePat) { drawDepthFalloff(c, w, h); return; }
    c.save();
    conePath(c, w, h, false); c.clip();
    c.globalCompositeOperation = "overlay";
    c.globalAlpha = 0.75;
    c.translate(-(t * 37 % 96), -(t * 53 % 96));
    c.fillStyle = noisePat;
    c.fillRect(0, 0, w + 96, h + 96);
    c.restore();
    drawDepthFalloff(c, w, h);
  }

  // real ultrasounds get murky the deeper they go
  function drawDepthFalloff(c, w, h) {
    c.save();
    conePath(c, w, h, false); c.clip();
    var g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(0.7, "rgba(0,0,0,0.10)");
    g.addColorStop(1, "rgba(0,0,0,0.36)");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.restore();
  }

  function drawConeFrame(c, w, h) {
    // black out everything outside the fan
    conePath(c, w, h, true);
    c.fillStyle = "#04060a";
    c.fill("evenodd");
    // fan outline
    var k = conePath(c, w, h, false);
    c.strokeStyle = "rgba(190,215,255,0.22)";
    c.lineWidth = 2;
    c.stroke();
    return k;
  }

  function drawChrome(c, w, h, t) {
    c.save();
    var mono = "ui-monospace, Menlo, Consolas, monospace";

    // ---- header bar: sits just above the probe face, so text is never on tissue
    var hb = 54;
    c.fillStyle = "#04060a";
    c.fillRect(0, 0, w, hb);
    c.font = "600 11px " + mono;
    c.textBaseline = "top";
    c.fillStyle = "rgba(215,230,255,0.85)";
    c.fillText("TUMMY-3000", 12, 9);
    c.fillStyle = "rgba(215,230,255,0.55)";
    c.fillText("C5-2 ABDOMEN", 12, 27);

    c.textAlign = "right";
    c.fillStyle = "rgba(215,230,255,0.85)";
    c.fillText("Gain 42", w - 12, 9);
    c.fillStyle = "rgba(215,230,255,0.55)";
    c.fillText("3.5MHz  D 12.5cm", w - 12, 27);
    c.textAlign = "left";

    // ---- footer strip in the black below the fan
    var fy = h - 30;
    c.fillStyle = "#04060a";
    c.fillRect(0, fy - 6, w, h - fy + 6);
    c.font = "600 11px " + mono;
    c.fillStyle = "rgba(215,230,255,0.6)";
    c.fillText("MI 0.7   TIS 0.3", 12, fy);
    // what the vision side is doing, so a weak lock is visible rather than baffling
    if (MODE === "scanning") {
      c.fillStyle = navel ? "rgba(150,225,180,0.85)" : "rgba(215,230,255,0.5)";
      c.fillText(navelManual ? "NAVEL SET" : (navel ? "NAVEL LOCK" : "SEEKING… (tap it)"), 128, fy);
    } else if (MODE === "play") {
      var locked = flowConf >= TUNE.flowConf * 2 && flowTex >= TUNE.flowTex;
      c.fillStyle = locked ? "rgba(150,225,180,0.8)" : "rgba(255,200,120,0.85)";
      c.fillText(locked ? "TRK LOCK" : "TRK WEAK", 128, fy);
    }

    c.textAlign = "right";
    if (motionMag > 0.18) {
      c.fillStyle = "rgba(255,205,120,0.95)";
      c.fillText("** MOVING **", w - 28, fy);
    } else {
      c.fillStyle = "rgba(215,230,255,0.6)";
      c.fillText("LIVE", w - 28, fy);
    }
    c.textAlign = "left";
    if (Math.sin(t * 4) > 0) {
      c.fillStyle = "rgba(120,255,170,0.9)";
      c.beginPath(); c.arc(w - 14, fy + 5, 4.5, 0, 6.2832); c.fill();
    }

    // ---- depth ruler, on its own dimmed strip so the numbers stay legible
    var top = hb + 8, bot = h * 0.86;
    var g = c.createLinearGradient(0, 0, 44, 0);
    g.addColorStop(0, "rgba(4,6,10,0.62)");
    g.addColorStop(1, "rgba(4,6,10,0)");
    c.fillStyle = g;
    c.fillRect(0, hb, 44, bot - hb + 14);

    c.strokeStyle = "rgba(215,230,255,0.55)";
    c.fillStyle = "rgba(215,230,255,0.7)";
    c.lineWidth = 1;
    c.font = "600 9px " + mono;
    c.beginPath(); c.moveTo(15, top); c.lineTo(15, bot); c.stroke();
    for (var d = 0; d <= 10; d++) {
      var yy = top + (bot - top) * (d / 10);
      var major = d % 2 === 0;
      c.beginPath(); c.moveTo(15, yy); c.lineTo(15 + (major ? 9 : 5), yy); c.stroke();
      if (major && d > 0 && d < 10) c.fillText(String(d), 27, yy - 4);
    }
    c.restore();
  }

  // sweeping beam that runs across the fan while scanning
  function drawBeam(c, w, h, t) {
    var k = conePath(c, w, h, false);
    c.save();
    c.clip();
    var span = k.a1 - k.a0;
    var a = k.a0 + (Math.sin(t * 1.15) * 0.5 + 0.5) * span;
    c.globalCompositeOperation = "lighter";
    for (var i = 0; i < 8; i++) {
      var off = i * 0.028;
      c.globalAlpha = 0.16 * (1 - i / 8);
      c.beginPath();
      c.moveTo(k.ax, k.ay);
      c.arc(k.ax, k.ay, k.rOut, a - off - 0.03, a - off + 0.03);
      c.closePath();
      c.fillStyle = "#bfe4ff";
      c.fill();
    }
    c.globalAlpha = 0.85;
    c.strokeStyle = "rgba(225,242,255,0.9)";
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(k.ax + Math.cos(a) * k.rIn, k.ay + Math.sin(a) * k.rIn);
    c.lineTo(k.ax + Math.cos(a) * k.rOut, k.ay + Math.sin(a) * k.rOut);
    c.stroke();
    c.restore();
  }

  // Faint dots along the detected torso outline — shows the analysis working
  // without pretending to be anatomy.
  function drawBodyEdges(c, w, h) {
    if (!maskValid || !mask) return;
    var kx = w / TW, ky = h / TH;
    c.save();
    conePath(c, w, h, false); c.clip();
    c.fillStyle = "rgba(150,220,255,0.30)";
    for (var y = 1; y < TH - 1; y++) {
      for (var x = 1; x < TW - 1; x++) {
        var p = y * TW + x;
        if (mask[p] !== 1) continue;
        if (mask[p - 1] && mask[p + 1] && mask[p - TW] && mask[p + TW]) continue;  // interior
        c.fillRect(x * kx - 1, y * ky - 1, 2.5, 2.5);
      }
    }
    c.restore();
  }

  // Debug view: paints the body mask and the match window straight onto the
  // screen, so you can see exactly what the vision code is working from.
  function drawMaskDebug(c, w, h) {
    if (!mask || !TUNE.showMask) return;
    var kx = w / TW, ky = h / TH;
    c.save();
    c.globalAlpha = 0.3;
    c.fillStyle = "#39d98a";
    for (var y = 0; y < TH; y++) {
      for (var x = 0; x < TW; x++) {
        if (mask[y * TW + x] === 1) c.fillRect(x * kx, y * ky, kx, ky);
      }
    }
    c.globalAlpha = 1;
    // the SAD match window
    c.strokeStyle = "#ffd166";
    c.lineWidth = 2;
    c.strokeRect(regX0 * kx, regY0 * ky, (regX1 - regX0) * kx, (regY1 - regY0) * ky);
    // the anchor we're holding onto
    var ax = anchorW.x - camX, ay = anchorW.y - camY;
    c.strokeStyle = "#ff6b6b";
    c.beginPath();
    c.moveTo(ax - 12, ay); c.lineTo(ax + 12, ay);
    c.moveTo(ax, ay - 12); c.lineTo(ax, ay + 12);
    c.stroke();
    c.restore();
  }

  // Target marker over the belly button.
  function drawNavelMark(c, w, h, t) {
    var ns = navelScreen();
    if (!ns) return;
    var manual = !!navelManual;
    c.save();
    c.translate(ns.x, ns.y);
    // hand-placed reads as a steady solid ring; auto keeps hunting with a dashed one
    c.strokeStyle = manual ? "rgba(150,255,190,0.95)" : "rgba(165,235,255,0.9)";
    c.lineWidth = manual ? 2.5 : 2;
    if (!manual) { c.setLineDash([5, 6]); c.lineDashOffset = -t * 16; }
    c.beginPath(); c.arc(0, 0, 27, 0, 6.2832); c.stroke();
    c.setLineDash([]);
    c.beginPath();
    for (var k = 0; k < 4; k++) {
      var a = k * Math.PI / 2 + Math.PI / 4;
      c.moveTo(Math.cos(a) * 15, Math.sin(a) * 15);
      c.lineTo(Math.cos(a) * 22, Math.sin(a) * 22);
    }
    c.stroke();
    c.font = "600 10px ui-monospace, Menlo, Consolas, monospace";
    c.textAlign = "center";
    if (manual) {
      c.fillStyle = "rgba(150,255,190,0.95)";
      c.fillText("NAVEL · SET", 0, 42);
    } else {
      // a guess, and it says so — with the correction always on offer
      c.fillStyle = "rgba(165,235,255,0.95)";
      c.fillText("NAVEL?", 0, 42);
      c.fillStyle = "rgba(215,235,255,0.7)";
      c.fillText("tap to move", 0, 55);
    }
    c.textAlign = "left";
    c.restore();
  }

  // full ultrasound frame. worms are clipped inside the fan so they
  // always look like they're actually in there.
  function renderScan(c, w, h, t, opts) {
    drawFeed(c, w, h);
    if (opts.worms && worms.length) {
      c.save();
      conePath(c, w, h, false); c.clip();
      // worms hold their spot on the belly: shift them opposite to the view
      c.translate(-camX, -camY);
      for (var i = worms.length - 1; i >= 0; i--) worms[i].draw(c, t);
      c.restore();
    }
    // speckle goes on LAST so the worms pick up the same grain as the tissue
    drawSpeckle(c, w, h, t);
    if (opts.beam) {
      drawBeam(c, w, h, t);
      drawBodyEdges(c, w, h);
      drawNavelMark(c, w, h, t);
    }
    if (TUNE.showMask) { drawMaskDebug(c, w, h); if (!opts.beam) drawNavelMark(c, w, h, t); }
    drawConeFrame(c, w, h);
    drawChrome(c, w, h, t);
  }

  // ------------------------------------------------------------------
  // main loop
  // ------------------------------------------------------------------
  function loop(now) {
    if (!running) return;
    requestAnimationFrame(loop);
    var t = now / 1000;
    var dt = Math.min(0.05, lastTime ? t - lastTime : 0.016);
    lastTime = t;

    // watch the frame rate; if a cheap phone is struggling, shed quality once
    perfAcc += dt; perfN++;
    if (perfN >= 30) {
      dbg.fps = perfN / perfAcc;
      if (!lowQ && dbg.fps < 26) { lowQ = true; maxDPR = 1; resize(); }
      perfAcc = 0; perfN = 0;
      refreshTuneStats();
    }

    updateMotion(dt);
    ctx.clearRect(0, 0, W, H);

    if (MODE === "scanning") {
      scanT += dt;
      renderScan(ctx, W, H, t, { beam: true, worms: false });
      // keeps scanning forever — you tap SEE INSIDE when you're ready
      // Auto-detection is a suggestion, not an answer — it lands in the wrong
      // place often enough (and confidently enough) that the offer to correct it
      // has to be permanent, not something that only appears when it gives up.
      if (!navelManual && scanT > 3.5 && t > navelHintUntil) {
        navelHintUntil = t + 9;
        shakeUntil = t + 3.5;
        setStatus(navel ? "👆 Wrong spot? Tap the belly button"
                        : "👆 Tap where the belly button is");
      }
      if (motionMag > 0.42 && t > shakeUntil && MODE === "scanning") {
        shakeUntil = t + 1.8; scanMsgIdx = -1;
        setStatus("Whoa — hold the probe steadier! 🤚");
      }
      if (t > shakeUntil) {
        var idx = Math.floor(scanT / 2.6) % SCAN_LINES.length;
        if (idx !== scanMsgIdx) { scanMsgIdx = idx; setStatus(SCAN_LINES[idx]); }
      }
      if (scanT > REVEAL_DELAY && $("revealWrap").classList.contains("hidden")) {
        $("revealWrap").classList.remove("hidden");
      }
    } else if (MODE === "play" || MODE === "result") {
      for (var i = worms.length - 1; i >= 0; i--) {
        worms[i].update(dt, t);
        if (worms[i].dead) worms.splice(i, 1);
      }
      renderScan(ctx, W, H, t, { beam: false, worms: true });
      updateCount();
    }

    updateParts(dt);
    drawParts(ctx);
  }

  function beginPlay() {
    if (MODE !== "scanning") return;
    MODE = "play";
    $("revealWrap").classList.add("hidden");
    // "the belly is here" — worms are pinned relative to this orientation
    resetOrientationRef();
    worms = [];
    applyDiet();                 // works out today's count from the diet + the streak
    var n = wormTarget();
    for (var i = 0; i < n; i++) worms.push(new Worm());
    buzz(n ? [80, 50, 80] : 40);
    if (n > 0) sonarPing();          // only when there's something to find
    var res = todayResult, improved = res && !res.first && res.after < res.before;
    if (n === 0) setStatus(improved ? "They're gone! ✨" : "Nothing wriggling in there ✨", "good");
    else if (improved) setStatus("One left! Still " + n + " in there 🪱", "good");
    else setStatus(n === 1 ? "Uh oh — there's one in there 🪱" : "Uh oh — two of them in there 🪱", "bad");
    updateCount();
    // auto-keep the reveal so the other kid can see this exact scan later
    setTimeout(function () { if (MODE === "play") saveScan(); }, 1300);
    setTimeout(function () {
      if (MODE === "play") $("doneWrap").classList.remove("hidden");
    }, 2600);
  }

  // ------------------------------------------------------------------
  // flow control
  // ------------------------------------------------------------------
  function showError(msg) {
    var e = $("err");
    e.classList.remove("hidden");
    e.innerHTML = msg;
    $("diet").classList.add("hidden");
    $("start").classList.remove("hidden");
  }

  // step 1 — the grown-up ticks off what was eaten today
  function openDiet() {
    $("err").classList.add("hidden");
    var p = activeProfile();
    $("dietTitle").innerHTML = "WHAT DID " + (p ? p.face + " " + p.name.toUpperCase() : "YOU") + "<br>EAT TODAY?";
    buildDiet();
    $("start").classList.add("hidden");
    $("result").classList.add("hidden");
    $("gallery").classList.add("hidden");
    $("viewer").classList.add("hidden");
    $("diet").classList.remove("hidden");
  }

  // step 2 — the scan itself
  function begin() {
    audio();
    enableMotion();
    $("err").classList.add("hidden");
    startCamera().then(function () {
      resize();
      $("diet").classList.add("hidden");
      $("start").classList.add("hidden");
      $("result").classList.add("hidden");
      $("gallery").classList.add("hidden");
      $("viewer").classList.add("hidden");
      $("doneWrap").classList.add("hidden");
      $("revealWrap").classList.add("hidden");
      $("hud").classList.remove("hidden");
      isFrozen = false; frozenFrame = null;
      $("freezeTxt").textContent = "Hold";
      $("freezeBtn").firstChild.nodeValue = "❄️ ";
      $("freezeBtn").style.borderColor = "rgba(160,195,240,.34)";
      MODE = "scanning"; scanT = 0; worms = []; parts = [];
      scanMsgIdx = -1; noisePat = null;
      oriRef = null; navel = null; navelMiss = 0; navelAnnounced = false;
      navelManual = null; navelHintUntil = 0; shakeUntil = 0;
      maskValid = false; trkTick = 0;
      trackerInit();
      updateCount();
      setStatus(SCAN_LINES[0]);
      setTorch(true);
      applyFocus(0.5, 0.5);
      startNoise();
      keepAwake(true);
      buzz(50);
      if (!running) { running = true; lastTime = 0; requestAnimationFrame(loop); }
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    }).catch(function (err) {
      var name = err && err.name ? err.name : String(err);
      if (name === "NotAllowedError" || name === "SecurityError") {
        showError("📷 The camera was blocked.<br>Tap the 🔒 in the address bar → Permissions → allow Camera, then try again.");
      } else if (name === "NO_API" || location.protocol === "file:") {
        showError("📷 Phone browsers only allow the camera on a secure page.<br>Open this file from an <code>https://</code> address or <code>localhost</code> — not by tapping the file directly.");
      } else if (name === "NotFoundError") {
        showError("📷 No camera found on this device.");
      } else {
        showError("📷 Couldn't start the camera (" + name + ").");
      }
    });
  }

  function quit() {
    MODE = "idle"; running = false; worms = []; parts = [];
    isFrozen = false; frozenFrame = null;
    ctx.clearRect(0, 0, W, H);
    stopNoise();
    keepAwake(false);
    stopCamera();
    updateGalCount();
    $("hud").classList.add("hidden");
    $("result").classList.add("hidden");
    $("diet").classList.add("hidden");
    $("gallery").classList.add("hidden");
    $("viewer").classList.add("hidden");
    $("doneWrap").classList.add("hidden");
    $("start").classList.remove("hidden");
    updateHomeState();
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
  }

  // ------------------------------------------------------------------
  // tuning panel
  // ------------------------------------------------------------------
  function buildTunePanel() {
    var box = $("dbgTune");
    box.innerHTML = "";
    TUNE_SPEC.forEach(function (spec) {
      var row = document.createElement("div");
      row.className = "trow";
      var lab = document.createElement("div");
      lab.className = "lab";
      var name = document.createElement("span");
      name.textContent = spec.label;
      var val = document.createElement("span");
      val.textContent = TUNE[spec.k];
      lab.appendChild(name); lab.appendChild(val);

      var sl = document.createElement("input");
      sl.type = "range";
      sl.min = spec.min; sl.max = spec.max; sl.step = spec.step;
      sl.value = TUNE[spec.k];
      sl.addEventListener("input", function () {
        TUNE[spec.k] = parseFloat(sl.value);
        val.textContent = TUNE[spec.k];
        saveTune();
      });

      row.appendChild(lab); row.appendChild(sl);
      box.appendChild(row);
    });
    $("dbgMask").checked = !!TUNE.showMask;
  }

  function refreshTuneStats() {
    if ($("debug").classList.contains("hidden")) return;
    var navOk = !!navel;
    var lines = [
      "fps   " + dbg.fps.toFixed(0) + (lowQ ? " (lowQ)" : "") + "   thumb " + TW + "x" + TH,
      "navel " + dbg.navelScore.toFixed(1) + "  -> " + (navelManual ? "MANUAL" : (navOk ? "LOCK" : "no")),
      "mask  " + (dbg.maskFrac * 100).toFixed(0) + "%  " + (maskValid ? "valid" : "INVALID"),
      "conf  " + flowConf.toFixed(3) + "   tex " + flowTex.toFixed(1),
      "flow  " + dbg.dx.toFixed(2) + ", " + dbg.dy.toFixed(2),
      "drift " + camX.toFixed(0) + ", " + camY.toFixed(0),
      "torch " + (torchSupported ? "yes" : "no") + "   mode " + MODE
    ];
    $("dbgStats").textContent = lines.join("\n");
  }

  function toggleDebug(show) {
    var d = $("debug");
    if (show) { buildTunePanel(); d.classList.remove("hidden"); refreshTuneStats(); }
    else d.classList.add("hidden");
  }

  // long-press the worm-count chip to open it — hard to hit by accident
  (function () {
    var timer = null;
    var chip = $("count");
    function down() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        toggleDebug($("debug").classList.contains("hidden"));
        buzz(60);
      }, 800);
    }
    function up() { clearTimeout(timer); }
    chip.addEventListener("pointerdown", down);
    chip.addEventListener("pointerup", up);
    chip.addEventListener("pointercancel", up);
    chip.addEventListener("pointerleave", up);
  })();

  $("dbgClose").addEventListener("click", function () { toggleDebug(false); });
  $("dbgMask").addEventListener("change", function () {
    TUNE.showMask = $("dbgMask").checked ? 1 : 0;
    saveTune();
  });
  $("dbgReset").addEventListener("click", function () {
    for (var k in TUNE_DEFAULTS) TUNE[k] = TUNE_DEFAULTS[k];
    saveTune(); buildTunePanel();
    $("dbgOut").textContent = "reset to defaults";
  });
  $("dbgCopy").addEventListener("click", function () {
    var txt = JSON.stringify(TUNE);
    $("dbgOut").textContent = txt;
    try {
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {});
    } catch (e) {}
  });

  // ------------------------------------------------------------------
  // wiring
  // ------------------------------------------------------------------
  $("go").addEventListener("click", openDiet);
  $("again").addEventListener("click", openDiet);
  $("toScan").addEventListener("click", begin);
  $("doneBtn").addEventListener("click", showResult);
  $("stopBtn").addEventListener("click", quit);
  $("freezeBtn").addEventListener("click", function () {
    if (MODE !== "play" && MODE !== "result") return;
    setFrozen(!isFrozen);
  });
  $("saveBtn").addEventListener("click", saveScan);
  $("revealBtn").addEventListener("click", beginPlay);
  $("openGallery").addEventListener("click", function () {
    renderGallery();
    $("start").classList.add("hidden");
    $("gallery").classList.remove("hidden");
  });
  $("galBack").addEventListener("click", function () {
    $("gallery").classList.add("hidden");
    $("start").classList.remove("hidden");
  });
  $("viewerBack").addEventListener("click", function () {
    $("viewer").classList.add("hidden");
  });
  $("torchBtn").addEventListener("click", function () {
    if (!torchSupported) {
      setStatus("This phone won't let the page control the flashlight 😕");
      return;
    }
    setTorch(!torchOn);
  });

  // Tap the belly to pin the nearest worm to that spot, and point the camera's
  // focus there at the same time.
  canvas.addEventListener("pointerdown", function (ev) {
    if (MODE !== "play" && MODE !== "scanning") return;
    var r = canvas.getBoundingClientRect();
    var sx = ev.clientX - r.left, sy = ev.clientY - r.top;

    var vw = r.width || canvas.clientWidth || W || 1;
    var vh = r.height || canvas.clientHeight || H || 1;
    applyFocus(sx / vw, sy / vh);

    // during the scan, a tap places the belly button by hand
    if (MODE === "scanning") {
      setNavelManual(sx, sy);
      navelAnnounced = true;
      shakeUntil = performance.now() / 1000 + 6;   // let it sit before the scan lines resume
      setStatus("Belly button set 👆 tap again to move it");
      buzz(35);
      return;
    }
    if (MODE !== "play" || !worms.length) {
      setStatus("Focusing there 🎯");
      buzz(15);
      return;
    }
    if (!insideCone(sx, sy, 40)) {
      setStatus("Tap inside the scan area 🎯");
      return;
    }

    // nearest worm, measured on screen where the finger actually is
    var target = null, best = 1e9;
    for (var i = 0; i < worms.length; i++) {
      var w = worms[i];
      if (w.dying) continue;
      var d = Math.hypot((w.x - camX) - sx, (w.y - camY) - sy);
      if (d < best) { best = d; target = w; }
    }
    if (!target) return;

    var p = toWorld(sx, sy);
    target.homeX = p.x; target.homeY = p.y;
    lockOnto(sx, sy);          // track the spot you just picked
    burst(sx, sy, "#dfe9f5", 8);
    buzz(25);
    setStatus(best < target.thick * 3.5
      ? "Pinned 📍 it'll stay on that spot"
      : "Come here! 📍 heading to that spot");
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (torchOn) setTorch(false);
      stopNoise();
      keepAwake(false);
    } else if (MODE === "scanning" || MODE === "play") {
      keepAwake(true);
      if (MODE === "scanning") startNoise();
    }
  });

  resize();
  loadProfiles();
  renderProfiles();
  updateGalCount();
  updateHomeState();
})();
</script>
</body>
</html>
