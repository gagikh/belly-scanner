# Shared build settings. Sourced by build-apk.sh, build-debug.sh and build-release.sh.
# Everything here can also be overridden by an environment variable of the same name.
#
# Nothing in the build refers to an absolute path: all locations are resolved
# relative to this file, or discovered from ANDROID_HOME / JAVA_HOME.

APP_ID="com.tummyscanner.app"
APP_NAME="Tummy Scanner"

# Used for the output filenames: <APP_SLUG>-debug.apk, <APP_SLUG>-release.aab
APP_SLUG="tummy-scanner"

# What users see.
VERSION_NAME="2.0"

# What Play checks. Must increase on EVERY upload — Play rejects a bundle whose
# versionCode isn't higher than the last one you sent, and the number can never
# be reused even if you delete the release. Bump this before each upload.
VERSION_CODE=2

# Google Play requires 36 for new submissions from 31 August 2026
TARGET_SDK=36

# Signing. KEYSTORE_FILE is relative to this directory unless you give it an
# absolute path; build-release.sh creates it on first use.
KEYSTORE_FILE="tummy-upload.jks"
KEY_ALIAS="upload"
KEY_DNAME="CN=Tummy Scanner, O=Tummy Scanner, C=US"

# Shown in the Play checklist reminder after a release build
PRIVACY_URL="https://gagikh.github.io/belly-scanner/privacy.html"

# --- Toolchain -------------------------------------------------------------
# Java versions Gradle can run on. The ceiling comes from the Gradle version the
# Capacitor Android template pins (8.14.x -> Java 24 max; Java 25 needs Gradle 9.1+).
# The scripts pick the newest installed JDK inside this range.
JAVA_MIN=17
JAVA_MAX=24

# Normally left blank: the scripts find the JDK from JAVA_HOME, then from an
# Android Studio install on any drive, then from PATH.
#
# Set these only if discovery fails. Better still, put them in build.local.conf
# (gitignored) so machine-specific paths never get committed:
#
#   JAVA_HOME="T:/Program Files/Android/Android Studio/jbr"
#   KEYTOOL="T:/Program Files/Android/Android Studio/jbr/bin/keytool.exe"
#   ANDROID_HOME="T:/Android/Sdk"
